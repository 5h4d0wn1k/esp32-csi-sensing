<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ESP32-CSI 3D Viewer</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#0d1117; color:#e6edf3;
         font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap;
         padding:10px 14px; background:#161b22; border-bottom:1px solid #30363d; }
  button { background:#21262d; color:#e6edf3; border:1px solid #30363d;
           padding:7px 14px; border-radius:6px; cursor:pointer; font:inherit; }
  button:hover { background:#30363d; }
  button.primary { background:#238636; border-color:#2ea043; }
  button.danger { background:#6e1f1f; border-color:#a24040; }
  #status { font-size:12px; color:#8b949e; white-space:pre; }
  #stats { font-size:12px; color:#58a6ff; }
  #wrap { display:flex; }
  #view3d { flex:1; height:calc(100vh - 60px); position:relative; }
  #side { width:270px; border-left:1px solid #30363d; padding:10px;
          display:flex; flex-direction:column; gap:8px; }
  canvas#spark, canvas#mspark { width:100%; height:90px; background:#0d1117;
                                border:1px solid #30363d; }
  .note { font-size:11px; color:#8b949e; }
  #err { position:absolute; left:0; right:0; top:0; padding:16px;
         background:#3a0d0d; color:#ff9b9b; font-size:13px; display:none; }
  input[type=file] { color:#e6edf3; }
</style>
<script type="importmap">
{ "imports": {
    "three": "./lib/three.module.js",
    "three/addons/": "./lib/"
} }
</script>
</head>
<body>
<div id="bar">
  <button id="btnHub" class="primary">Connect Hub (WS)</button>
  <button id="btnSerial">Web Serial (fallback)</button>
  <button id="btnPause">Pause</button>
  <button id="btnWire">Wireframe</button>
  <label class="note">Load capture: <input type="file" id="file" accept=".csv"></label>
  <span id="stats"></span>
  <span id="status">Not connected — click "Connect Hub"</span>
</div>
<div id="wrap">
  <div id="view3d">
    <div id="err"></div>
  </div>
  <div id="side">
    <div class="note">Amplitude surface: X = time, Z = subcarrier, Y = amplitude.
      Drag to rotate, wheel to zoom, right-drag to pan.</div>
    <div class="note" id="motionNote" style="font-size:15px;font-weight:bold">MOTION: --</div>
    <div class="note" id="motionThr">calibrating...</div>
    <div class="note" id="motionSig">signal: --</div>
    <div class="note" id="rssiNote">RSSI: --</div>
    <button id="recalBtn" title="Reset the motion baseline + threshold">Recalibrate</button>
    <canvas id="spark"></canvas>
    <div class="note" id="sparkNote">RSSI over time</div>
    <canvas id="mspark"></canvas>
    <div class="note" id="msparkNote">motion metric (deviation) — red line = threshold</div>
  </div>
</div>

<script type="module">
let THREE, OrbitControls;
try {
  THREE = await import('three');
  OrbitControls = (await import('three/addons/controls/OrbitControls.js')).OrbitControls;
} catch (e) {
  document.getElementById('err').style.display = 'block';
  document.getElementById('err').textContent =
    'Three.js failed to load: ' + e.message +
    '\nIs tools/lib/ present next to this HTML? (three.module.js + OrbitControls.js)';
  throw e;
}

let N_SUB = 0, MAX_FRAMES = 150;
const RE = /^CSI_DATA,(\d+),([0-9a-f:]+),(-?\d+),(\d+),(\d+),(\d+),(\d+),(\d+),(\d+),(\d+),(\d+),(\d+),(\d+),(-?\d+),(\d+),(\d+),(\d+),(\d+),(\d+),(\d+),(\d+),(\d+),(\d+),"(\[[^\]]*\])"$/;

const statsEl = document.getElementById('stats');
const statusEl = document.getElementById('status');
const btnPause = document.getElementById('btnPause');
const btnWire = document.getElementById('btnWire');
const VER = '5.5';
statusEl.textContent = 'v' + VER + ' — click "Connect Hub"';

let ws = null, port = null, reader = null;
let paused = false, wireframe = false;
let mesh = null, wireMesh = null, scene = null, applyNSub = null;
let frames = [], srcName = '-';
let count = 0, fps = 0, lastTs = 0, rssiHist = [];

// ---- host-side motion detection (all processing here in the browser) ----
const MVAR_MS = 1500, MCAL_MS = 5000, M_THR_RATIO = 1.5, M_ON = 1.0, M_OFF = 3.0,
      M_LEVEL_Q = 0.95, M_TRANSIENT_DB = 2.0;
let mState = 'INACTIVE', tUp = 0, tDown = 0, mThr = null, mCal = [], mCal0 = 0,
    mVarHist = [], mRing = [];
let mHist = [];
let phs = [];

// ---- dominant-source selection (multi-transmitter capture) ----
let srcCounts = {}, activeMac = null, lastSrcEval = 0;

function parseCsiLine(line) {
  const m = RE.exec(line);
  if (!m) return null;
  const arr = m[24].slice(1, -1).split(',');
  const n = arr.length >> 1 << 1;
  const amp = new Float32Array(n / 2);
  for (let i = 0; i < n; i += 2) {
    const im = parseInt(arr[i], 10), re = parseInt(arr[i + 1], 10);
    amp[i >> 1] = Math.hypot(im, re);
  }
  return { rssi: parseInt(m[3], 10), channel: parseInt(m[16], 10), amp };
}

// ---------- 3D scene ----------
let camera, renderer;
try {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d1117);
  camera = new THREE.PerspectiveCamera(55, 2, 0.1, 2000);
  camera.position.set(90, 55, 120);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  document.getElementById('view3d').appendChild(renderer.domElement);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(60, 20, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const dl = new THREE.DirectionalLight(0xffffff, 0.8);
  dl.position.set(80, 120, 40);
  scene.add(dl);

  let gridGeom = null, pos = null, col = null;
  function makeSurface(nSub) {
    if (mesh) { scene.remove(mesh); scene.remove(wireMesh); mesh.geometry.dispose(); }
    const v = nSub * MAX_FRAMES;
    pos = new Float32Array(v * 3);
    col = new Float32Array(v * 3);
    const idx = [];
    for (let f = 0; f < MAX_FRAMES - 1; f++) {
      for (let s = 0; s < nSub - 1; s++) {
        const a = f * nSub + s, b = a + 1, c = a + nSub, d = c + 1;
        idx.push(a, b, c, b, d, c);
      }
    }
    gridGeom = new THREE.BufferGeometry();
    gridGeom.setIndex(idx);
    gridGeom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    gridGeom.setAttribute('color', new THREE.BufferAttribute(col, 3));
    gridGeom.computeVertexNormals();
    const mat = new THREE.MeshPhongMaterial({
      vertexColors: true, side: THREE.DoubleSide, shininess: 20,
      transparent: true, opacity: 0.95,
    });
    const m = new THREE.Mesh(gridGeom, mat);
    scene.add(m); mesh = m;
    const wireMat = new THREE.MeshBasicMaterial({ vertexColors: true, wireframe: true });
    const w = new THREE.Mesh(gridGeom, wireMat);
    w.visible = false;
    scene.add(w); wireMesh = w;
  }
  applyNSub = function (nSub) {
    if (nSub === N_SUB) return;
    N_SUB = nSub;
    controls.target.set(60, 20, N_SUB / 2);
    makeSurface(nSub);
    frames.length = 0; phs.length = 0; mHist.length = 0; mCal.length = 0; mCal0 = 0;
    mThr = null; mVarHist.length = 0; mRing.length = 0;
    mState = 'INACTIVE'; tUp = 0; tDown = 0; rssiHist.length = 0;
    srcCounts = {}; activeMac = null; lastSrcEval = 0;
  };

  const GRAD = [[68,1,84],[71,44,122],[59,81,139],[44,113,142],[33,145,140],
                [39,173,129],[92,200,99],[170,220,50],[253,231,37]];
  function gradColor(t) {
    t = Math.min(1, Math.max(0, t)) * (GRAD.length - 1);
    const i = Math.min(GRAD.length - 2, Math.floor(t));
    const f = t - i, a = GRAD[i], b = GRAD[i + 1];
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
  }
  function ampMax() {
    let mx = 1;
    for (const f of frames) for (let s = 0; s < f.length; s++) if (f[s] > mx) mx = f[s];
    return mx;
  }
  let lastRender = 0;
  function rebuild() {
    const T = frames.length, mx = ampMax(), zoff = (N_SUB - 1) / 2;
    for (let t = 0; t < MAX_FRAMES; t++) {
      const frame = t < T ? frames[T - 1 - t] : null;
      for (let s = 0; s < N_SUB; s++) {
        const k = (t * N_SUB + s) * 3;
        pos[k] = t; pos[k + 1] = frame ? frame[s] : 0; pos[k + 2] = s - zoff;
        const c = frame ? gradColor(frame[s] / mx) : [40, 40, 40];
        col[k] = c[0] / 255; col[k + 1] = c[1] / 255; col[k + 2] = c[2] / 255;
      }
    }
    gridGeom.attributes.position.needsUpdate = true;
    gridGeom.attributes.color.needsUpdate = true;
    gridGeom.computeVertexNormals();
  }
  function animate(t) {
    requestAnimationFrame(animate);
    if (frames.length && t - lastRender > 50) { rebuild(); lastRender = t; }
    controls.update();
    renderer.render(scene, camera);
  }
  window.addEventListener('resize', () => {
    const el = document.getElementById('view3d');
    camera.aspect = el.clientWidth / el.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(el.clientWidth, el.clientHeight);
  });
  renderer.setSize(document.getElementById('view3d').clientWidth,
                   document.getElementById('view3d').clientHeight);
  requestAnimationFrame(animate);
} catch (e) {
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = '3D init failed: ' + e.message +
    ' (check WebGL is enabled in this browser)';
}

// ---------- data entry ----------
function handleFrame(r) {
  if (!r || !r.amp) return;
  if (applyNSub && r.nsub && r.nsub !== N_SUB) applyNSub(r.nsub);
  if (r.amp.length !== N_SUB) return;
  const now = performance.now();
  if (r.mac) srcCounts[r.mac] = (srcCounts[r.mac] || 0) + 1;
  if (now - lastSrcEval > 2000) {
    let best = null, bn = 0;
    for (const m in srcCounts) if (srcCounts[m] > bn) { bn = srcCounts[m]; best = m; }
    if (best && best !== activeMac) activeMac = best;
    srcCounts = {}; lastSrcEval = now;
  }
  if (activeMac && r.mac && r.mac !== activeMac) return;
  if (r.src) srcName = r.src;
  frames.push(r.amp);
  phs.push(r.ph);
  if (frames.length > MAX_FRAMES) frames.shift();
  if (phs.length > MAX_FRAMES) phs.shift();
  count++;
  const now2 = performance.now();
  if (now2 - lastTs > 1000) {
    fps = Math.round(count * 1000 / (now2 - lastTs)); count = 0; lastTs = now2;
    statusEl.textContent = `Receiving CSI — ${fps}/s from ${srcName}`;
  }
  if (r.rssi !== undefined) {
    rssiHist.push(r.rssi);
    if (rssiHist.length > 300) rssiHist.shift();
  }
  runMotion(r.amp, r.rssi);
  drawSpark(); drawMSpark();
  statsEl.textContent =
    `src:${srcName}` + (activeMac ? ` [${activeMac}]` : '') +
    `  frames:${frames.length}/${MAX_FRAMES}  ${fps}/s` +
    (r.ch ? `  ch:${r.ch}` : '');
  if (r.rssi !== undefined)
    document.getElementById('rssiNote').textContent = `RSSI: ${r.rssi} dBm`;
}

function runMotion(amp, rssi) {
  if (frames.length < 2) return;
  const now = performance.now();
  const win = frames.slice(-Math.min(30, frames.length));
  // Per-frame normalisation: divide each frame by its own mean magnitude so the
  // receiver AGC gain steps (2x jumps) cancel out and only the CSI *shape* change
  // from body motion remains. Metric = mean absolute normalised amplitude
  // deviation from the short-window baseline (validated on router link: static
  // variance ~0.01, body motion ~0.05+).
  const mag = (f) => { let s = 0; for (const v of f) s += v; return s / f.length + 1e-6; };
  const winMag = win.map(mag), curMag = mag(amp);
  const base = new Float32Array(N_SUB);
  for (let k = 0; k < win.length; k++)
    for (let s = 0; s < N_SUB; s++) base[s] += win[k][s] / winMag[k];
  for (let s = 0; s < N_SUB; s++) base[s] /= win.length;
  let acc = 0;
  for (let s = 0; s < N_SUB; s++) acc += Math.abs(amp[s] / curMag - base[s]);
  const dev = acc / N_SUB;
  // AGC transient rejection with a 3-frame commit delay. An AGC gain step is a
  // >2 dB RSSI jump between consecutive frames and looks exactly like body motion
  // in the shape metric (corr(dev,rssi)~0.9), so it must not count. Each frame's
  // flag is only final once jumps at [idx-3, idx+2] are known, hence the delay.
  mRing.push({ t: now, rssi: (rssi === undefined ? null : rssi), v: dev });
  if (mRing.length > 12) mRing.shift();
  if (mRing.length >= 4) {
    const c = mRing[mRing.length - 4];
    let bad = false;
    if (c.rssi !== null) {
      for (let j = Math.max(1, mRing.length - 7); j <= mRing.length - 2 && !bad; j++) {
        const a = mRing[j].rssi, b = mRing[j - 1].rssi;
        if (a !== null && b !== null && Math.abs(a - b) > M_TRANSIENT_DB) bad = true;
      }
    }
    if (!bad) {
      mHist.push({ t: c.t, v: c.v });
      if (mHist.length > 4000) mHist.shift();
    }
  }
  const varDev = rollingStd(mHist, now, MVAR_MS);
  if (varDev !== null) {
    mVarHist.push(varDev);
    if (mVarHist.length > 600) mVarHist.shift();
  }
  // Decision level = 95th percentile of varDev over the last ~6s. Motion is
  // sporadic (a body is only momentarily in a sensitive spot); the tail captures
  // it while a stable static floor stays far below.
  const level = quantile(mVarHist, M_LEVEL_Q);
  if (mThr === null) {
    if (level !== null) mCal.push(level);
    if (mCal0 === 0) mCal0 = now;
    if (mCal.length >= 40 && now - mCal0 >= MCAL_MS) {
      mThr = quantile(mCal, 0.9) * M_THR_RATIO;
      document.getElementById('motionThr').textContent =
        `threshold: ${mThr.toFixed(3)} (cal ${(now - mCal0) / 1000 | 0}s, p90×${M_THR_RATIO})`;
      document.getElementById('recalBtn').disabled = false;
    } else {
      document.getElementById('motionThr').textContent =
        `calibrating static baseline... ${mCal.length} samples / ${(now - mCal0) / 1000 | 0}s`;
    }
    return;
  }
  // Time-based hysteresis on the LEVEL: ACTIVE only after it stays above the
  // threshold for M_ON s; INACTIVE after M_OFF s of quiet.
  if (level > mThr) tUp = now; else tDown = now;
  if (mState === 'INACTIVE' && now - tDown >= M_ON * 1000) mState = 'ACTIVE';
  if (mState === 'ACTIVE' && now - tUp >= M_OFF * 1000) mState = 'INACTIVE';
  const el = document.getElementById('motionNote');
  el.textContent = 'MOTION: ' + mState;
  el.style.color = mState === 'ACTIVE' ? '#f85149' : '#3fb950';
  document.getElementById('motionSig').textContent =
    `signal(p95): ${level === null ? '--' : level.toFixed(3)}  (threshold ${mThr.toFixed(3)})`;
}

function quantile(arr, q) {
  if (arr.length < 8) return null;
  const srt = [...arr].sort((a, b) => a - b);
  return srt[Math.min(srt.length - 1, (srt.length * q) | 0)];
}

function rollingStd(arr, now, winMs) {
  const cutoff = now - winMs;
  let i = arr.length - 1;
  while (i >= 0 && arr[i].t > cutoff) i--;
  const sub = arr.slice(i + 1);
  if (sub.length < 8) return null;
  let mean = 0;
  for (const s of sub) mean += s.v;
  mean /= sub.length;
  let sse = 0;
  for (const s of sub) { const d = s.v - mean; sse += d * d; }
  return Math.sqrt(sse / sub.length);
}

function recalibrate() {
  mState = 'INACTIVE'; tUp = 0; tDown = 0; mThr = null;
  mCal.length = 0; mCal0 = 0; mVarHist.length = 0; mRing.length = 0;
  document.getElementById('recalBtn').disabled = true;
  document.getElementById('motionThr').textContent = 'recalibrating...';
}

// ---------- WebSocket hub (primary) ----------
function connectHub() {
  disconnect();
  try {
    ws = new WebSocket('ws://127.0.0.1:8765');
  } catch (e) { statusEl.textContent = 'WS failed: ' + e.message; return; }
  ws.onopen = () => statusEl.textContent = 'Hub connected — waiting for CSI...';
  ws.onmessage = (ev) => {
    if (paused) return;
    if (typeof ev.data !== 'string') return;  // defensive: we only send text frames
    let r; try { r = JSON.parse(ev.data); } catch (e) { return; }
    if (r.kind === 'csi') handleFrame(r);
  };
  ws.onclose = () => {
    statusEl.textContent = 'Hub disconnected';
    setTimeout(() => { if (!ws || ws.readyState === WebSocket.CLOSED) connectHub(); }, 2000);
  };
  ws.onerror = () => { statusEl.textContent = 'Hub connection error'; };
}

// ---------- Web Serial (fallback) ----------
let lineBuf = '';
async function readLoop() {
  while (reader) {
    const { value, done } = await reader.read();
    if (done) break;
    lineBuf += new TextDecoder().decode(value);
    let nl;
    while ((nl = lineBuf.indexOf('\n')) >= 0) {
      const line = lineBuf.slice(0, nl).trim();
      lineBuf = lineBuf.slice(nl + 1);
      if (line.startsWith('CSI_DATA')) {
        const r = parseCsiLine(line);
        if (r) handleFrame({ src: 'serial', kind: 'csi', ...r });
      }
    }
  }
  await disconnect();
}
async function connectSerial() {
  if (!navigator.serial) {
    statusEl.textContent = 'Web Serial not supported here — use "Connect Hub" instead.';
    return;
  }
  disconnect();
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 921600 });
    reader = port.readable.getReader();
    statusEl.textContent = 'Serial connected 921600 baud';
    readLoop();
  } catch (e) { statusEl.textContent = 'serial connect cancelled/failed'; }
}

function disconnect() {
  if (ws) { try { ws.onclose = null; ws.close(); } catch (e) {} ws = null; }
  if (reader) { try { reader.cancel(); } catch (e) {} reader = null; }
  if (port) { try { port.close(); } catch (e) {} port = null; }
}

// ---------- CSV replay ----------
document.getElementById('file').addEventListener('change', async (ev) => {
  const f = ev.target.files[0];
  if (!f) return;
  disconnect();
  const text = await f.text();
  frames = []; let loaded = 0;
  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (!line.startsWith('CSI_DATA')) continue;
    const r = parseCsiLine(line);
    if (r) {
      frames.push(r.amp);
      if (frames.length > MAX_FRAMES) frames.shift();
      loaded++;
    }
  }
  statusEl.textContent = `Loaded CSV: ${loaded} frames`;
});

// ---------- sparklines ----------
const spark = document.getElementById('spark');
const sctx = spark.getContext('2d');
const mspark = document.getElementById('mspark');
const mctx = mspark.getContext('2d');
function drawSpark() {
  const w = spark.width = spark.clientWidth * devicePixelRatio;
  const h = spark.height = spark.clientHeight * devicePixelRatio;
  sctx.clearRect(0, 0, w, h);
  sctx.strokeStyle = '#58a6ff'; sctx.lineWidth = 2;
  const n = rssiHist.length;
  if (n < 2) return;
  const mn = Math.min(...rssiHist), mx = Math.max(...rssiHist);
  const span = (mx - mn) || 1;
  sctx.beginPath();
  for (let i = 0; i < n; i++) {
    const x = i / (n - 1) * w;
    const y = h - (rssiHist[i] - mn) / span * (h - 6) - 3;
    i ? sctx.lineTo(x, y) : sctx.moveTo(x, y);
  }
  sctx.stroke();
}
function drawMSpark() {
  const w = mspark.width = mspark.clientWidth * devicePixelRatio;
  const h = mspark.height = mspark.clientHeight * devicePixelRatio;
  mctx.clearRect(0, 0, w, h);
  const n = mHist.length;
  if (n < 2) return;
  const clean = mHist.map(s => s.v).filter(v => Number.isFinite(v));
  if (clean.length < 2) return;
  const mx = Math.max(...clean, mThr || 1);
  mctx.strokeStyle = '#f0883e'; mctx.lineWidth = 2;
  mctx.beginPath();
  for (let i = 0; i < clean.length; i++) {
    const x = i / (clean.length - 1) * w;
    const y = h - clean[i] / mx * (h - 6) - 3;
    i ? mctx.lineTo(x, y) : mctx.moveTo(x, y);
  }
  mctx.stroke();
  if (mThr !== null) {
    mctx.strokeStyle = '#f85149'; mctx.setLineDash([4, 4]);
    mctx.beginPath();
    const y = h - mThr / mx * (h - 6) - 3;
    mctx.moveTo(0, y); mctx.lineTo(w, y);
    mctx.stroke();
    mctx.setLineDash([]);
  }
}

// ---------- controls ----------
btnPause.onclick = () => {
  paused = !paused;
  btnPause.textContent = paused ? 'Resume' : 'Pause';
};
btnWire.onclick = () => {
  wireframe = !wireframe;
  btnWire.textContent = wireframe ? 'Surface' : 'Wireframe';
  if (mesh) mesh.visible = !wireframe;
  if (wireMesh) wireMesh.visible = wireframe;
};
document.getElementById('btnHub').onclick = connectHub;
document.getElementById('btnSerial').onclick = connectSerial;
const recalBtn = document.getElementById('recalBtn');
recalBtn.disabled = true;
recalBtn.onclick = recalibrate;

// auto-connect when opened as ?auto=1 (also used for headless tests)
if (new URLSearchParams(location.search).has('auto')) connectHub();
</script>
</body>
</html>
